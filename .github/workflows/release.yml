name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android 17 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-37
            build-tools;37.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Create CI signing key
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/release.p12" \
            -storetype PKCS12 \
            -storepass android \
            -keypass android \
            -alias experiment \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=YuChuang Floating Control, O=YuChuang"

      - name: Build APK
        env:
          ANDROID_SIGNING_STORE: ${{ runner.temp }}/release.p12
          ANDROID_SIGNING_PASSWORD: android
          ANDROID_SIGNING_ALIAS: experiment
        run: gradle --no-daemon assembleRelease

      - name: Get version name
        id: version
        run: |
          VERSION_NAME=$(grep "versionName" build.gradle | sed "s/.*versionName '\(.*\)'/\1/")
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/outputs/apk/release/*.apk
          name: Release ${{ steps.version.outputs.VERSION_NAME }}
          body: |
            ## 驭窗浮控 ${{ steps.version.outputs.VERSION_NAME }}

            面向骑行和移动场景的轻量悬浮助手，将快捷应用、导航、媒体控制和运行状态集中在一个可贴边移动的悬浮界面中。

            ### 本版内容
            - 快捷应用、导航和音乐入口可独立排序
            - 媒体会话实时同步，支持上一首、播放/暂停、下一首
            - 常驻展开、自动收起、点击窗外收起和防误触保护
            - 可调悬浮窗尺寸、图标尺寸、贴边位置、透明度和屏幕常亮
            - 支持控制中心磁贴快速启停
            - 支持通过 Shizuku 扩展系统日志采集，便于排查卡顿和异常
            - 支持浅色、深色、强光高对比和磨砂玻璃悬浮样式

            ### 下载
            下载 APK 后安装到 Android 17（API 37）设备。首次使用需要授予悬浮窗权限；媒体控制需要通知使用权。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
