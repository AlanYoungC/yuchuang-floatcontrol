plugins {
    id 'com.android.application' version '9.3.3'
}

android {
    namespace 'cn.yuchuang.floatcontrol'
    compileSdk 37
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId 'cn.yuchuang.floatcontrol'
        minSdk 37
        targetSdk 37
        versionCode 44
        versionName '1.8.8'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            aidl.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }

    buildFeatures {
        aidl true
    }

    def signingStore = providers.environmentVariable("ANDROID_SIGNING_STORE")
        .orElse("../experiment-signing.p12").get()
    def signingPassword = providers.environmentVariable("ANDROID_SIGNING_PASSWORD")
        .orElse("android").get()
    def signingAlias = providers.environmentVariable("ANDROID_SIGNING_ALIAS")
        .orElse("experiment").get()

    buildTypes {
        release {
            def store = file(signingStore)
            if (store.exists()) {
                signingConfig signingConfigs.create("releaseCi") {
                    storeFile store
                    storePassword signingPassword
                    keyAlias signingAlias
                    keyPassword signingPassword
                    storeType 'pkcs12'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'androidx.metrics:metrics-performance:1.0.0'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'
}
